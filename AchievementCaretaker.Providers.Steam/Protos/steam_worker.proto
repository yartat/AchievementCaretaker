syntax = "proto3";

option csharp_namespace = "AchievementCaretaker.Providers.Steam.Protocol";

package caretaker.steam;

// What the Steam helper process offers the application. One helper serves one app id:
// ISteamUserStats is scoped to the app id a process was initialised with.
service SteamWorker {
  rpc GetAchievements (GetAchievementsRequest) returns (GetAchievementsReply);
  rpc GetStats (GetStatsRequest) returns (GetStatsReply);
  // Sets the listed achievements and statistics and stores them in one go; nothing is
  // stored if any is refused.
  rpc Commit (CommitRequest) returns (CommitReply);
  // Resets every statistic, and the achievements too if asked.
  rpc Reset (ResetRequest) returns (ResetReply);
  // Asks the helper to exit once the reply is sent.
  rpc Shutdown (ShutdownRequest) returns (ShutdownReply);
}

message Achievement {
  string id = 1;
  string display_name = 2;
  string description = 3;
  string icon_url = 4;
  bool hidden = 5;
  bool unlocked = 6;
  // Absent when Steam did not say, which is not the same as the epoch.
  optional int64 unlock_time_unix = 7;
  optional int32 xp = 8;
  optional double rarity_percent = 9;
  optional double progress = 10;
  // Steam's permission bits forbid changing it.
  bool is_protected = 11;
}

message GetAchievementsRequest {}

message GetAchievementsReply {
  repeated Achievement achievements = 1;
}

enum StatKind {
  INTEGER = 0;
  FLOAT = 1;
}

message Stat {
  string id = 1;
  string display_name = 2;
  StatKind kind = 3;
  double value = 4;
  double min = 5;
  double max = 6;
  double max_change = 7;
  bool increment_only = 8;
  double default_value = 9;
  bool is_protected = 10;
}

message GetStatsRequest {}

message GetStatsReply {
  repeated Stat stats = 1;
}

message AchievementChange {
  string id = 1;
  bool unlocked = 2;
}

message StatChange {
  string id = 1;
  double value = 2;
}

message CommitRequest {
  repeated AchievementChange achievements = 1;
  repeated StatChange stats = 2;
}

message CommitReply {}

message ResetRequest {
  bool include_achievements = 1;
}

message ResetReply {}

message ShutdownRequest {}

message ShutdownReply {}
