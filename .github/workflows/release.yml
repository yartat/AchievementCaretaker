# Copyright (c) 2026 Yaroslav V Tatarenko
#
# See LICENSE in the repository root.
#
# Pushing a tag of the form v1.2.3 builds the release artifacts and publishes
# them on a GitHub release:
#
#   achievement-caretaker-1.2.3-win-x64-setup.exe      installer
#   achievement-caretaker-1.2.3-win-x64-portable.zip   unzip and run
#   achievement-caretaker-1.2.3-win-x86-setup.exe
#   achievement-caretaker-1.2.3-win-x86-portable.zip
#   achievement-caretaker_1.2.3_amd64.deb
#
# Every one of them is self-contained: the .NET runtime is inside, so nothing
# has to be installed first. That is what makes the portable build portable,
# and the installer has no way to fetch a runtime anyway.
#
# Everything is cross-built on ubuntu-latest; no Windows runner is needed.
#
# workflow_dispatch builds the same artifacts and uploads them as workflow
# artifacts, which is how to exercise the packaging without tagging - but note
# it follows the ref it is dispatched against. From a branch it stops there;
# dispatched against a tag, github.ref_type is 'tag' and the release job runs
# and publishes. Add `github.event_name == 'push' &&` to that job's condition if
# a dispatch should never be able to publish.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails the run when the tag and the repository disagree about the version.
  # The version sits in the projects and in a window-title literal that is
  # not generated from the assembly version, so overriding it from the tag would
  # leave the title saying something else.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        name: Resolve and verify the version
        run: |
          set -euo pipefail
          VERSION="$(bash packaging/version.sh)"
          VERSION="${VERSION#VERSION=}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Extract the release notes for this version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          awk -v want="## ${{ steps.resolve.outputs.version }} " '
            index($0, want) == 1 { inside = 1 }
            inside && $0 == "---" { exit }
            inside { print }
          ' docs/RELEASE-NOTES.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "docs/RELEASE-NOTES.md has no '## ${{ steps.resolve.outputs.version }} ...' section"
            exit 1
          fi
          head -5 release-notes.md

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  windows:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            platform: AnyCPU
            arch: x64
          - rid: win-x86
            # Not cosmetic: -r win-x86 alone resolves 32-bit native libraries
            # but still emits a 64-bit apphost, and that bundle dies in
            # SkiaSharp's type initializer with nothing printed. The
            # check-pe-arch.sh step below is what stops it shipping.
            platform: x86
            arch: x86
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # NSIS cross-compiles the installer stub, so this still needs no Windows
      # machine and no Wine. zip is already on the runner.
      - name: Install NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends nsis

      - name: Publish, then build the installer and the portable archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          DIR="achievement-caretaker-${VERSION}-${{ matrix.rid }}-portable"
          dotnet publish AchievementCaretaker.App/AchievementCaretaker.App.csproj \
            -c Release -r "${{ matrix.rid }}" -p:Platform="${{ matrix.platform }}" \
            --self-contained true -o "out/$DIR"
          bash packaging/check-pe-arch.sh "out/$DIR" "${{ matrix.rid }}"
          bash packaging/check-policy.sh "out/$DIR"
          # Debug symbols are a third of the tree and nothing needs them.
          find "out/$DIR" -name '*.pdb' -delete
          mkdir -p dist
          bash packaging/windows/build-installer.sh \
            --publish-dir "out/$DIR" \
            --version "$VERSION" \
            --arch "${{ matrix.arch }}" \
            --output dist \
            --homepage "${{ github.server_url }}/${{ github.repository }}"
          (cd out && zip -q -r -9 "../dist/${DIR}.zip" "$DIR")
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          retention-days: 7

  deb:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Self-contained: a framework-dependent deb would have to depend on
      # dotnet-runtime-10.0, which only exists in Microsoft's apt repository, so
      # `apt install ./*.deb` would fail on a stock Debian or Ubuntu.
      - name: Publish and package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          bash packaging/check-policy.sh
          dotnet publish AchievementCaretaker.App/AchievementCaretaker.App.csproj \
            -c Release -r linux-x64 --self-contained true -o out/linux-x64
          bash packaging/linux/build-deb.sh \
            --publish-dir out/linux-x64 \
            --version "$VERSION" \
            --output dist \
            --homepage "${{ github.server_url }}/${{ github.repository }}"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          retention-days: 7

  release:
    needs: [version, windows, deb]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # A job-level permissions block replaces the set rather than adding to it:
    # anything not listed here becomes `none`. contents: write alone left
    # actions: none, and download-artifact reads the Artifacts API, so it failed
    # with "Failed to ListArtifacts: (403) Forbidden".
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          find artifacts -type f | sort
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Achievement Caretaker $VERSION" \
            --notes-file artifacts/release-notes/release-notes.md \
            artifacts/win-x64/* \
            artifacts/win-x86/* \
            artifacts/deb/*.deb

  # Chocolatey is Windows-only: choco pack and push run on the Windows runner, from
  # the same script a maintainer runs by hand. It runs after the release exists,
  # because the package downloads the portable zips from it and hashes them.
  chocolatey:
    needs: [version, release]
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build and push the Chocolatey package
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          bash packaging/chocolatey/build.sh "$VERSION" --out dist/chocolatey --push
