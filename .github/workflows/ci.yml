#
# Build validation for pushes and pull requests. Releases are built by
# release.yml, which a v* tag triggers.

name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Check that the workflows are pinned
        run: bash packaging/check-workflows.sh

      # A clean build is 0 warnings, 0 errors, so hold that line rather than
      # trusting it. This does not prove the windows open: resource lookups and
      # StyleInclude paths resolve at runtime. See "Verifying a build" in
      # docs/BUILD.md for the headless check that does.
      - name: Build
        run: dotnet build AchievementCaretaker.slnx -c Release -p:TreatWarningsAsErrors=true

      # Runs on Linux, which is the only place the tests of the Unix session store and of
      # the file permissions run: they skip on Windows, as the DPAPI ones skip here.
      - name: Test
        run: dotnet test --solution AchievementCaretaker.slnx -c Release

      - name: Install NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends nsis

      # The architecture check is what would have caught a 64-bit apphost
      # shipping inside a 32-bit bundle. Building the installers here too means
      # a broken installer script fails on the pull request rather than at tag
      # time, when the only way out is another tag.
      - name: Publish each Windows target, check it and package it
        run: |
          set -euo pipefail
          package() {
            local rid="$1" platform="$2" arch="$3"
            dotnet publish AchievementCaretaker.App/AchievementCaretaker.App.csproj \
              -c Release -r "$rid" -p:Platform="$platform" --self-contained true -o "out/$rid" >/dev/null
            bash packaging/check-pe-arch.sh "out/$rid" "$rid"
            bash packaging/check-policy.sh "out/$rid"
            find "out/$rid" -name '*.pdb' -delete
            bash packaging/windows/build-installer.sh \
              --publish-dir "out/$rid" --version "$VERSION" --arch "$arch" --output dist \
              --homepage "${{ github.server_url }}/${{ github.repository }}"
          }
          VERSION="$(bash packaging/version.sh)"
          VERSION="${VERSION#VERSION=}"
          package win-x64 AnyCPU x64
          package win-x86 x86 x86

      - name: Keep the 64-bit installer for the installer test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-x64
          path: dist/*-win-x64-setup.exe
          retention-days: 1

      - name: Build the Debian package
        run: |
          set -euo pipefail
          VERSION="$(bash packaging/version.sh)"
          VERSION="${VERSION#VERSION=}"
          bash packaging/check-policy.sh
          dotnet publish AchievementCaretaker.App/AchievementCaretaker.App.csproj \
            -c Release -r linux-x64 --self-contained true -o out/linux-x64 >/dev/null
          bash packaging/linux/build-deb.sh \
            --publish-dir out/linux-x64 \
            --version "$VERSION" \
            --output dist \
            --homepage "${{ github.server_url }}/${{ github.repository }}"

  # The macOS app is built on a macOS runner because it needs codesign (an arm64 binary with no
  # signature is killed by the kernel), ditto, sips and iconutil. It proves the bundle is
  # assembled and signed and that every native library is the right architecture. It does not
  # prove the app starts: no Mac has run it yet.
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - rid: osx-x64
            arch: x64
          - rid: osx-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Publish, check and package the app
        run: |
          set -euo pipefail
          VERSION="$(bash packaging/version.sh)"
          VERSION="${VERSION#VERSION=}"
          dotnet publish AchievementCaretaker.App/AchievementCaretaker.App.csproj \
            -c Release -r "${{ matrix.rid }}" --self-contained true -o "out/${{ matrix.rid }}" >/dev/null
          bash packaging/check-macho-arch.sh "out/${{ matrix.rid }}" "${{ matrix.rid }}"
          bash packaging/check-policy.sh "out/${{ matrix.rid }}"
          bash packaging/macos/build-app.sh \
            --publish-dir "out/${{ matrix.rid }}" --version "$VERSION" --arch "${{ matrix.arch }}" --output dist

  # The installer removes folders, so what it removes is tried for real: silent installs and
  # uninstalls into throw-away folders on a Windows runner.
  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-x64
          path: dist

      - name: Install, upgrade and uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist -Filter *-setup.exe).FullName
          ./packaging/windows/test-installer.ps1 -Setup $setup
