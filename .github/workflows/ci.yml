#
# Build validation for pushes and pull requests. Releases are built by
# release.yml, which a v* tag triggers.

name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # A clean build is 0 warnings, 0 errors, so hold that line rather than
      # trusting it. This does not prove the windows open: resource lookups and
      # StyleInclude paths resolve at runtime. See "Verifying a build" in
      # docs/BUILD.md for the headless check that does.
      - name: Build
        run: dotnet build AchievementCaretaker.slnx -c Release -p:TreatWarningsAsErrors=true

      - name: Install NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends nsis

      # The architecture check is what would have caught a 64-bit apphost
      # shipping inside a 32-bit bundle. Building the installers here too means
      # a broken installer script fails on the pull request rather than at tag
      # time, when the only way out is another tag.
      - name: Publish each Windows target, check it and package it
        run: |
          set -euo pipefail
          package() {
            local rid="$1" platform="$2" arch="$3"
            dotnet publish AchievementCaretaker.App/AchievementCaretaker.App.csproj \
              -c Release -r "$rid" -p:Platform="$platform" --self-contained true -o "out/$rid" >/dev/null
            bash packaging/check-pe-arch.sh "out/$rid" "$rid"
            bash packaging/check-policy.sh "out/$rid"
            find "out/$rid" -name '*.pdb' -delete
            bash packaging/windows/build-installer.sh \
              --publish-dir "out/$rid" --version "$VERSION" --arch "$arch" --output dist \
              --homepage "${{ github.server_url }}/${{ github.repository }}"
          }
          VERSION="$(bash packaging/version.sh)"
          VERSION="${VERSION#VERSION=}"
          package win-x64 AnyCPU x64
          package win-x86 x86 x86

      - name: Build the Debian package
        run: |
          set -euo pipefail
          VERSION="$(bash packaging/version.sh)"
          VERSION="${VERSION#VERSION=}"
          bash packaging/check-policy.sh
          dotnet publish AchievementCaretaker.App/AchievementCaretaker.App.csproj \
            -c Release -r linux-x64 --self-contained true -o out/linux-x64 >/dev/null
          bash packaging/linux/build-deb.sh \
            --publish-dir out/linux-x64 \
            --version "$VERSION" \
            --output dist \
            --homepage "${{ github.server_url }}/${{ github.repository }}"
