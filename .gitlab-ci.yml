# AchievementCaretaker
# Copyright (c) 2026 Yaroslav V Tatarenko
#
# See LICENSE in the repository root.
#
# Pushing a tag of the form v1.2.3 builds the release artifacts, uploads them to
# the project's generic package registry and creates the GitLab release:
#
#   achievement-caretaker-1.2.3-win-x64-setup.exe      installer
#   achievement-caretaker-1.2.3-win-x64-portable.zip   unzip and run
#   achievement-caretaker-1.2.3-win-x86-setup.exe
#   achievement-caretaker-1.2.3-win-x86-portable.zip
#   achievement-caretaker_1.2.3_amd64.deb
#
# All of them are self-contained: the .NET runtime is inside, so nothing has to
# be installed first.
#
# Everything is cross-built from one Linux image; no Windows runner is needed.
#
# The image must carry an SDK at least as new as global.json asks for (10.0.400
# with rollForward latestFeature), or restore fails before anything else does.
# The build job prints `dotnet --version` first so that is obvious in the log.
#
# The scripts under packaging/ are invoked with `bash` rather than executed, so
# the pipeline does not depend on the executable bit surviving in git.

stages:
  - prepare
  - build
  - package
  - release

variables:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget"
  SOLUTION: "AchievementCaretaker.slnx"
  APP_PROJECT: "AchievementCaretaker.App/AchievementCaretaker.App.csproj"
  PKG_NAME: "achievement-caretaker"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/achievement-caretaker"

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  interruptible: true
  cache:
    key:
      files:
        - AchievementCaretaker.App/AchievementCaretaker.App.csproj
        - AchievementCaretaker.SteamApi/AchievementCaretaker.SteamApi.csproj
    paths:
      - .nuget/

# Tags and merge requests always build; a branch builds only when it has no open
# merge request, so one push does not produce two identical pipelines.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# --------------------------------------------------------------------------
# prepare
# --------------------------------------------------------------------------

# Publishes VERSION to every later job through dotenv, which is what lets the
# release keyword below interpolate it - a shell export would not survive.
#
# On a tag this also fails the pipeline when the tag and the repository disagree
# about the version. The version sits in the projects and in a window-title
# literal that is not generated from the assembly version, so overriding it
# from the tag would leave the title saying something else.
version:
  stage: prepare
  script:
    # Not piped into tee: the pipeline's status would be tee's, so a version
    # mismatch inside version.sh would not fail this job.
    - bash packaging/version.sh > version.env
    - cat version.env
    - . ./version.env
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        awk -v want="## $VERSION " '
          index($0, want) == 1 { inside = 1 }
          inside && $0 == "---" { exit }
          inside { print }
        ' docs/RELEASE-NOTES.md > release-description.md
        if [ ! -s release-description.md ]; then
          echo "docs/RELEASE-NOTES.md has no '## $VERSION ...' section"
          exit 1
        fi
        echo "release description:"
        head -5 release-description.md
      else
        echo "Development build, not a release." > release-description.md
      fi
  artifacts:
    expire_in: 1 week
    paths:
      - release-description.md
    reports:
      dotenv: version.env

# --------------------------------------------------------------------------
# build
# --------------------------------------------------------------------------

# A clean build is 0 warnings, 0 errors, so CI holds that line rather than
# trusting it. Note this does not prove the windows open: resource lookups and
# StyleInclude paths resolve at runtime. See "Verifying a build" in
# docs/BUILD.md for the headless check that does.
build:
  stage: build
  needs: ["version"]
  script:
    - dotnet --version
    - dotnet build "$SOLUTION" -c Release -p:TreatWarningsAsErrors=true

# --------------------------------------------------------------------------
# package
# --------------------------------------------------------------------------

.windows_package:
  stage: package
  needs: ["version", "build"]
  script:
    - apt-get update -qq
    # NSIS cross-compiles the installer stub; no Windows machine, no Wine.
    - apt-get install -yqq --no-install-recommends zip nsis
    - DIR="${PKG_NAME}-${VERSION}-${RID}-portable"
    # PLATFORM matters as much as RID: -r win-x86 alone resolves 32-bit native
    # libraries but still emits a 64-bit apphost, and that build dies in
    # SkiaSharp's type initializer with nothing printed. check-pe-arch.sh below
    # is there so this can never be shipped again.
    - dotnet publish "$APP_PROJECT" -c Release -r "$RID" -p:Platform="$PLATFORM" --self-contained true -o "out/$DIR"
    - bash packaging/check-pe-arch.sh "out/$DIR" "$RID"
    # Debug symbols are a third of the tree and nothing needs them.
    - find "out/$DIR" -name '*.pdb' -delete
    - mkdir -p dist
    - |
      bash packaging/windows/build-installer.sh \
        --publish-dir "out/$DIR" \
        --version "$VERSION" \
        --arch "$ARCH" \
        --output dist \
        --homepage "$CI_PROJECT_URL"
    - (cd out && zip -q -r -9 "../dist/${DIR}.zip" "$DIR")
    - ls -lh dist
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        for f in dist/*; do
          curl --fail --silent --show-error \
            --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --upload-file "$f" \
            "${PACKAGE_REGISTRY_URL}/${VERSION}/$(basename "$f")"
          echo "uploaded $(basename "$f")"
        done
      fi
  artifacts:
    expire_in: 1 week
    paths:
      - "dist/*"
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true

package:win-x64:
  extends: .windows_package
  variables:
    RID: win-x64
    PLATFORM: AnyCPU
    ARCH: x64

package:win-x86:
  extends: .windows_package
  variables:
    RID: win-x86
    PLATFORM: x86
    ARCH: x86

# There is no arm64 job on purpose. Valve ships no ARM build of the Steam
# client, and this application loads that client into its own process, so an
# arm64 build starts and then reports that it cannot talk to Steam. Arm users
# run the x64 build under emulation - see docs/RELEASE-NOTES.md.

package:deb:
  stage: package
  needs: ["version", "build"]
  script:
    # Self-contained: a framework-dependent deb would have to depend on
    # dotnet-runtime-10.0, which only exists in Microsoft's apt repository, so
    # `apt install ./*.deb` would fail on a stock Debian or Ubuntu.
    - dotnet publish "$APP_PROJECT" -c Release -r linux-x64 --self-contained true -o out/linux-x64
    - |
      bash packaging/linux/build-deb.sh \
        --publish-dir out/linux-x64 \
        --version "$VERSION" \
        --output dist \
        --homepage "$CI_PROJECT_URL"
    - ls -lh dist
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "dist/${PKG_NAME}_${VERSION}_amd64.deb" \
          "${PACKAGE_REGISTRY_URL}/${VERSION}/${PKG_NAME}_${VERSION}_amd64.deb"
        echo "uploaded ${PKG_NAME}_${VERSION}_amd64.deb"
      fi
  artifacts:
    expire_in: 1 week
    paths:
      - "dist/*.deb"
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true

# --------------------------------------------------------------------------
# release
# --------------------------------------------------------------------------

# The links point at the package registry rather than at job artifacts, which
# expire. Only the version job's artifacts are downloaded here; the packages are
# already uploaded and would only be dead weight.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: version
      artifacts: true
    - job: package:win-x64
      artifacts: false
    - job: package:win-x86
      artifacts: false
    - job: package:deb
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Releasing $CI_COMMIT_TAG as $VERSION"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Achievement Caretaker $VERSION"
    description: release-description.md
    assets:
      links:
        - name: "Windows x64 (zip, needs the .NET 10 Desktop Runtime)"
          url: "${PACKAGE_REGISTRY_URL}/${VERSION}/${PKG_NAME}-${VERSION}-win-x64.zip"
          link_type: package
        - name: "Windows x86 (zip, needs the .NET 10 Desktop Runtime)"
          url: "${PACKAGE_REGISTRY_URL}/${VERSION}/${PKG_NAME}-${VERSION}-win-x86.zip"
          link_type: package
        - name: "Debian/Ubuntu amd64 (deb, self-contained)"
          url: "${PACKAGE_REGISTRY_URL}/${VERSION}/${PKG_NAME}_${VERSION}_amd64.deb"
          link_type: package
